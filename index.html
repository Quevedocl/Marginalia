<title>Margen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
@property --c1{syntax:'<color>';inherits:true;initial-value:#1b4332}
@property --c2{syntax:'<color>';inherits:true;initial-value:#12302b}
@property --tint{syntax:'<color>';inherits:true;initial-value:#4dffa3}
/* Layout: one phone-sized stage. Fluid aura behind, three tab views, a push view for playlists,
   a floating tab bar and mini player, and the Now Playing sheet that slides over everything. */
:root{
  color-scheme:dark;
  --bg:#000;
  --label:#ffffff;
  --label-2:rgba(235,235,245,.6);
  --label-3:rgba(235,235,245,.34);
  --glass:rgba(0,0,0,.2);
  --glass-edge:rgba(255,255,255,.1);
  --sep:rgba(255,255,255,.1);
  --tint:#4dffa3;
  --red:#ff453a;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  --font-round:"SF Pro Rounded",ui-rounded,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --spring:cubic-bezier(.34,1.56,.64,1);
  --ios:cubic-bezier(.32,.72,0,1);
  --snap:cubic-bezier(.3,1.3,.5,1);
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--label);font-family:var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font-family:inherit;color:inherit;background:none;border:0;padding:0;text-align:left;cursor:pointer}
h1,h2,p{margin:0}

#stage{--sat:max(env(safe-area-inset-top,0px),10px);--sab:env(safe-area-inset-bottom,0px);
  position:relative;width:100%;height:calc(100% + env(safe-area-inset-top,0px) + env(safe-area-inset-bottom,0px));
  margin-top:calc(-1 * env(safe-area-inset-top,0px));overflow:hidden;background:#000;isolation:isolate;
  transition:--c1 1.4s ease,--c2 1.4s ease,--tint 1.4s ease;-webkit-user-select:none;user-select:none}
@media (min-width:520px){
  #stage{--sat:59px;--sab:34px;width:430px;height:min(932px,calc(100% - 32px));margin:16px auto 0;border-radius:56px;
    box-shadow:0 0 0 9px #141418,0 0 0 10.5px #34343a,0 40px 100px rgba(0,0,0,.7)}
  #island{opacity:1}
  #sb{display:flex}
}

/* Aura: two dominant colors from the cover, blurred into a fluid glow */
#aura{position:absolute;inset:-25%;z-index:0;filter:blur(120px) saturate(200%);transform:translateZ(0);pointer-events:none}
.blob{position:absolute;border-radius:50%;opacity:.85;will-change:transform}
.b1{left:0;top:0;width:70%;height:50%;background:var(--c1);animation:d1 22s ease-in-out infinite alternate}
.b2{right:0;bottom:0;width:75%;height:55%;background:var(--c2);animation:d2 26s ease-in-out infinite alternate}
.b3{left:25%;top:30%;width:50%;height:35%;background:color-mix(in srgb,var(--c1) 50%,var(--c2));animation:d1 30s ease-in-out infinite alternate-reverse}
@keyframes d1{to{transform:translate(18%,22%) scale(1.15)}}
@keyframes d2{to{transform:translate(-20%,-18%) scale(1.1)}}
#scrim{position:absolute;inset:0;z-index:0;background:linear-gradient(rgba(0,0,0,.3),rgba(0,0,0,.66));pointer-events:none}

/* Status bar and Dynamic Island (decorative in the desktop frame, a live notification pill on iPhone) */
#sb{display:none;position:absolute;z-index:19;top:0;left:0;right:0;height:54px;padding:19px 36px 0;justify-content:space-between;align-items:flex-start;font:600 16px var(--font);pointer-events:none}
#sb svg{width:26px;height:13px;fill:#fff}
#island{position:absolute;z-index:20;top:11px;left:0;right:0;margin-inline:auto;width:126px;height:37px;border-radius:20px;background:#000;opacity:0;pointer-events:none;overflow:hidden;
  transition:width .6s var(--spring),height .6s var(--spring),border-radius .6s var(--spring),opacity .2s}
#island.open{opacity:1;width:min(calc(100% - 32px),372px);height:66px;border-radius:33px}
.il{position:absolute;inset:0;display:flex;align-items:center;gap:12px;padding:0 20px;opacity:0;transition:opacity .2s}
#island.open .il{opacity:1;transition:opacity .35s .2s}
.ilt{font:700 16px var(--font-round);font-variant-numeric:tabular-nums;color:var(--tint)}
.ilp{font-size:15px;font-weight:500;line-height:1.25;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* Materials */
.glass{background:linear-gradient(135deg,rgba(255,255,255,.08) 0%,rgba(255,255,255,.02) 100%);-webkit-backdrop-filter:blur(60px) saturate(220%) brightness(1.15);backdrop-filter:blur(60px) saturate(220%) brightness(1.15);box-shadow:inset 0 1px 1px rgba(255,255,255,.3),inset 0 0 0 1px rgba(255,255,255,.08),0 24px 48px rgba(0,0,0,.5)}
.list{overflow:hidden}
.glass.list{background:none;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none}
.press{transition:transform .34s var(--snap),filter .22s,opacity .3s;touch-action:manipulation}
.press:active{transform:scale(.96);filter:brightness(.9);transition-duration:.07s}

/* Views */
#app{position:absolute;inset:0;z-index:1;transform-origin:50% 0;transition:transform .6s var(--ios),opacity .6s var(--ios),border-radius .6s var(--ios)}
#app.behind{transform:scale(.92) translateY(calc(var(--sat) * .25));opacity:.5;border-radius:38px;overflow:hidden}
.tab{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none;
  padding-top:calc(var(--sat) + 12px);padding-bottom:calc(var(--sab) + 160px);transition:transform .6s var(--ios),opacity .5s var(--ios)}
.tab::-webkit-scrollbar,#push::-webkit-scrollbar,.hs::-webkit-scrollbar{display:none}
.tab.under{transform:translateX(-28%);opacity:.35;pointer-events:none}
.g{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.large{font-size:36px;line-height:1.1;font-weight:700;letter-spacing:-.41px;margin:8px 0 18px;display:flex;justify-content:space-between;align-items:center}
.sec-h{font-size:22px;font-weight:700;letter-spacing:.2px;margin:26px 0 12px}

function makeCover(seed,h1,h2,kind){
  const S=480,c=document.createElement('canvas');c.width=c.height=S;
  const g=c.getContext('2d'),r=rng(seed*977+13),col=(h,l,a)=>`hsla(${h},80%,${l}%,${a})`;
  const gr=g.createLinearGradient(0,0,S,S);gr.addColorStop(0,`hsl(${h1},72%,54%)`);gr.addColorStop(1,`hsl(${h2},70%,20%)`);
  g.fillStyle=gr;g.fillRect(0,0,S,S);
  switch(kind){
    case 0:for(let i=0;i<6;i++){g.strokeStyle=col(h1+30,80,.5-i*.06);g.lineWidth=14;g.beginPath();g.arc(S*.5,S*.62,60+i*38,Math.PI,0);g.stroke()}break;
    case 1:for(let i=0;i<9;i++){g.fillStyle=col(h2,i%2?60:30,.45);g.fillRect(0,i*S/9+10*r(),S,S/18)}break;
    case 2:g.fillStyle=col(h1+40,75,.9);g.beginPath();g.arc(S*.5,S*.46,95,0,7);g.fill();g.fillStyle=col(h2,12,.85);g.fillRect(0,S*.6,S,S);break;
    case 3:for(let y=0;y<10;y++)for(let x=0;x<10;x++){g.fillStyle=col(h1+60,78,.12+.6*r());g.beginPath();g.arc(24+x*48,24+y*48,5+r()*14,0,7);g.fill()}break;
    case 4:for(let i=0;i<5;i++){g.strokeStyle=col(h2+i*14,70,.55);g.lineWidth=22;g.beginPath();g.arc(0,S,90+i*70,-Math.PI/2,0);g.stroke()}break;
    case 5:for(let i=0;i<7;i++){g.fillStyle=col(h1+i*20,55+i*3,.5);g.fillRect(r()*S*.7,r()*S*.7,60+r()*140,60+r()*140)}break;
    case 6:for(let i=0;i<8;i++){g.strokeStyle=col(h1+i*10,78,.5);g.lineWidth=6;g.beginPath();for(let x=0;x<=S;x+=8){const y=S*.25+i*34+Math.sin(x/38+i)*18;x?g.lineTo(x,y):g.moveTo(x,y)}g.stroke()}break;
    default:g.save();g.translate(S/2,S/2);g.rotate(-.6);for(let i=-6;i<7;i++){g.fillStyle=col(h2+i*8,60,.35);g.fillRect(-S,i*44,S*2,20)}g.restore();
  }
  for(let i=0;i<2500;i++){g.fillStyle=`rgba(255,255,255,${r()*.05})`;g.fillRect(r()*S,r()*S,2,2)}
  return c;
}
const probe=$('#probe'),pg=probe.getContext('2d',{willReadFrequently:true});
function boost(c){const l=(c[0]+c[1]+c[2])/3;let o=c.map(v=>Math.max(0,Math.min(255,l+(v-l)*1.6)));const m=Math.max(...o)||1,k=Math.min(6,Math.max(1,225/m));return o.map(v=>Math.min(255,Math.round(v*k)))}
const css=c=>`rgb(${c[0]},${c[1]},${c[2]})`;
function dominant(src){
  pg.clearRect(0,0,32,32);pg.drawImage(src,0,0,32,32);
  const d=pg.getImageData(0,0,32,32).data,B=Array.from({length:12},()=>({w:0,r:0,g:0,b:0}));
  for(let i=0;i<d.length;i+=4){
    const r=d[i],g=d[i+1],b=d[i+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b),df=mx-mn,v=mx/255,s=mx?df/mx:0;
    if(v<.12)continue;
    let h=0;if(df){h=mx===r?((g-b)/df)%6:mx===g?(b-r)/df+2:(r-g)/df+4;h=(h*60+360)%360}
    const o=B[Math.floor(h/30)%12],w=s*s*(.25+v)+.01;o.w+=w;o.r+=r*w;o.g+=g*w;o.b+=b*w;
  }
  const ord=B.map((o,k)=>({...o,k})).sort((a,b)=>b.w-a.w),a=ord[0];
  const b=ord.find(o=>o.w>a.w*.18&&Math.min(Math.abs(o.k-a.k),12-Math.abs(o.k-a.k))>=2);
  const ca=[a.r/a.w,a.g/a.w,a.b/a.w];
  const cb=b?[b.r/b.w,b.g/b.w,b.b/b.w]:[(ca[1]+ca[0])/2,(ca[2]+ca[1])/2,(ca[0]+ca[2])/2];
  const A=boost(ca),Bc=boost(cb),tint=A.map(v=>Math.round(v+(255-v)*.38));
  return{c1:css(A),c2:css(Bc),tint:css(tint)};
}

const P={tid:null,base:0,t0:0,playing:false,last:0};

function applyColors(t){stage.style.setProperty('--c1',t.col.c1);stage.style.setProperty('--c2',t.col.c2);}
function load(tid,ms=0,autoplay=true){
  if(!queue.includes(tid))queue=T.map(t=>t.id);
  P.tid=tid;P.base=ms;P.t0=performance.now();P.last=ms;P.playing=autoplay;
  hideNote();renderNow();applyColors(cur());renderMini();updatePlayIcons();

function setPlaying(v){if(!P.tid||P.playing===v)return;P.base=pos();P.t0=performance.now();P.playing=v;updatePlayIcons();
  if(live&&sp){if(v&&!spLoaded)spPlay(P.tid,P.base,true);else v?sp.resume():sp.pause()}}
function seek(ms){P.base=Math.max(0,Math.min(ms,cur().dur-500));P.t0=performance.now();P.last=P.base;hideNote();if(live&&sp)sp.seekTo(P.base);mediaSync()}
function step(d){
  if(d<0&&pos()>3000){seek(0);return}
  const i=queue.indexOf(P.tid);load(queue[(i+d+queue.length)%queue.length],0,true);
}

/* Pull-to-dismiss (drag down) and Haptic Touch (long press on the cover) */
let drag=null,lp=null;
const cover=$('#np-cover');
function cancelLong(){if(lp){clearTimeout(lp);lp=null}cover.classList.remove('holding')}
sheet.addEventListener('pointerdown',e=>{
  if(e.target.closest('#np-bar,.ghost,#composer'))return;
  drag={id:e.pointerId,x:e.clientX,y:e.clientY,active:false,dy:0,vy:0,ly:e.clientY,lt:performance.now()};
  if(e.target.closest('#np-cover')){cover.classList.add('holding');lp=setTimeout(()=>{lp=null;drag=null;cover.classList.remove('holding');openComposer()},480)}
});
sheet.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.active){
    if(Math.hypot(dx,dy)<9)return;cancelLong();
    if(dy>0&&dy>Math.abs(dx)){drag.active=true;try{sheet.setPointerCapture(e.pointerId)}catch(_){}}else{drag=null;return}
  }
  const now=performance.now();drag.vy=(e.clientY-drag.ly)/Math.max(1,now-drag.lt);drag.ly=e.clientY;drag.lt=now;drag.dy=Math.max(0,dy);
  sheet.style.transform=`translateY(${drag.dy}px) scale(${1-Math.min(drag.dy/1400,.14)})`;
});
const dragEnd=e=>{
  cancelLong();if(!drag||e.pointerId!==drag.id)return;const d=drag;drag=null;if(!d.active)return;
  if(d.dy>130||d.vy>.6)closeSheet();
  else springAnimate(sheet,v=>({transform:`translateY(${v}px) scale(${1-Math.min(v/1400,.14)})`}),d.dy,0,{ms:700});
};

/* ---------- Spotify (OAuth PKCE + Web Playback SDK) y Supabase ---------- */
const CFG={
  spotifyClientId:'d637a2a2fb46439bb99536eb38307806',   // Spotify Developer Dashboard → tu app → Client ID
  supabaseUrl:'https://atgteivjjsyjmqvbzzwd.supabase.co',       // https://xxxx.supabase.co
  supabaseKey:'sb_publishable_cgBlHI7cyeabNdWQpb7deQ_WR2vdEFp'        // clave anon / publishable
};
const REDIRECT=location.origin+location.pathname;
const SCOPES='streaming user-read-email user-read-private user-read-playback-state user-modify-playback-state playlist-read-private user-library-read';
const TK='marginalia.spotify.token';
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
async function login(){
  if(!CFG.spotifyClientId){island('!','Falta spotifyClientId en CFG',4500);return}
  const v=b64(crypto.getRandomValues(new Uint8Array(48)));
  const ch=b64(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));
  localStorage.setItem('marginalia.pkce',v);
  location.href='https://accounts.spotify.com/authorize?'+new URLSearchParams({client_id:CFG.spotifyClientId,response_type:'code',redirect_uri:REDIRECT,scope:SCOPES,code_challenge_method:'S256',code_challenge:ch});
}
const tok=()=>{try{return JSON.parse(localStorage.getItem(TK))}catch(e){return null}};
const tokReq=o=>fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:CFG.spotifyClientId,...o})}).then(r=>r.ok?r.json():Promise.reject(r));
const saveTok=j=>{const o={a:j.access_token,r:j.refresh_token||tok()?.r,e:Date.now()+j.expires_in*1000-60000};localStorage.setItem(TK,JSON.stringify(o));return o};
async function token(){
  let o=tok();if(!o)return null;
  if(Date.now()>o.e){try{o=saveTok(await tokReq({grant_type:'refresh_token',refresh_token:o.r}))}catch(e){if(e&&(e.status===400||e.status===401))localStorage.removeItem(TK);return null}}
  return o.a;
}
const api=async(path,opt={})=>{
  const r=await fetch('https://api.spotify.com/v1'+path,{...opt,headers:{Authorization:'Bearer '+await token(),'Content-Type':'application/json'}});
  if(!r.ok)throw r;return r.json().catch(()=>null);
};

/* Tracks reales: carátula en alta resolución + color dominante calculado en segundo plano */
const DEF={c1:'#1b4332',c2:'#12302b',tint:'#4dffa3'};
const bigImg=a=>(a||[]).reduce((m,i)=>(i.height||0)>(m.height||0)?i:m,{}).url||'';
function mkTrack(o,hid){const t={id:o.id,uri:o.uri||'spotify:track:'+o.id,title:o.title,artist:o.artist,album:o.album||'',genre:'',dur:o.dur||0,cover:o.cover||'',col:DEF,hid};colorize(t);return t}
function colorize(t){if(!t.cover)return;const im=new Image();im.crossOrigin='anonymous';im.onload=()=>{try{t.col=dominant(im);if(cur()===t)applyColors(t)}catch(e){}};im.src=t.cover}
const fromApi=x=>x&&x.id&&x.type!=='episode'?mkTrack({id:x.id,uri:x.uri,title:x.name,artist:x.artists.map(a=>a.name).join(', '),album:x.album&&x.album.name,dur:x.duration_ms,cover:bigImg(x.album&&x.album.images)}):null;
async function fetchLibrary(){
  const seen=new Map(),add=x=>{const t=fromApi(x);if(!t)return null;if(!seen.has(t.id))seen.set(t.id,t);return seen.get(t.id)};
  const [liked,pls]=await Promise.all([api('/me/tracks?limit=50'),api('/me/playlists?limit=20')]);
  liked.items.forEach(i=>add(i.track));
  const items=async id=>{try{return await api('/playlists/'+id+'/items?limit=50')}catch(e){return api('/playlists/'+id+'/tracks?limit=50')}};
  const res=await Promise.all(pls.items.filter(Boolean).map(async p=>{try{const r=await items(p.id);return{id:p.id,name:p.name,desc:(p.owner&&p.owner.display_name)||'',ids:r.items.map(i=>add(i.track||i.item)).filter(Boolean).map(t=>t.id)}}catch(e){return null}}));
  return{T:[...seen.values()],PL:res.filter(p=>p&&p.ids.length)};
}

/* Supabase: tabla marginalia_notes (ver marginalia_notes.sql) */
const sbOn=()=>live&&CFG.supabaseUrl&&CFG.supabaseKey;
const sbf=(path,o={})=>fetch(CFG.supabaseUrl+'/rest/v1/'+path,{...o,headers:{apikey:CFG.supabaseKey,...(CFG.supabaseKey.startsWith('eyJ')?{Authorization:'Bearer '+CFG.supabaseKey}:{}),'Content-Type':'application/json',Prefer:'resolution=merge-duplicates',...o.headers}});
const sbUp=n=>{if(sbOn())sbf('marginalia_notes',{method:'POST',body:JSON.stringify({id:n.id,user_id:uid,track_id:n.tid,ms:n.ms,text:n.text,meta:n.meta||null})}).catch(()=>{})};
const sbDel=id=>{if(sbOn())sbf('marginalia_notes?id=eq.'+encodeURIComponent(id)+'&user_id=eq.'+encodeURIComponent(uid),{method:'DELETE'}).catch(()=>{})};
async function sbPull(local){
  if(!sbOn())return local;
  const r=await sbf('marginalia_notes?select=*&order=ms&user_id=eq.'+encodeURIComponent(uid));
  if(!r.ok)return local;
  const remote=(await r.json()).map(x=>({id:x.id,tid:x.track_id,ms:x.ms,text:x.text,meta:x.meta}));
  const have=new Set(remote.map(n=>n.id)),pending=local.filter(n=>!have.has(n.id));
  pending.forEach(sbUp);return[...remote,...pending];
}

/* Reproductor: Web Playback SDK (solo navegadores de escritorio, requiere Premium) */
const duck=on=>{if(live&&sp)sp.setVolume(on?.2:vol)};
function spPlay(tid,ms,go){
  if(!sp||!dev||!go)return;sp.activateElement();
  const t=TR(tid),uris=queue.map(id=>TR(id)&&TR(id).uri).filter(Boolean).slice(0,100);
  if(!uris.includes(t.uri))uris.unshift(t.uri);
  api('/me/player/play?device_id='+dev,{method:'PUT',body:JSON.stringify({uris,offset:{uri:t.uri},position_ms:Math.round(ms)})}).catch(()=>island('!','No se pudo reproducir',3000));
}
function onState(s){
  const c=s&&s.track_window&&s.track_window.current_track;if(!c)return;
  let t=TR(c.id);
  if(!t){t=mkTrack({id:c.id,uri:c.uri,title:c.name,artist:c.artists.map(a=>a.name).join(', '),album:c.album.name,dur:s.duration,cover:bigImg(c.album.images)},true);T.push(t)}
  if(!t.dur)t.dur=s.duration;
  const changed=P.tid!==t.id,jump=Math.abs(s.position-pos())>1500;
  P.tid=t.id;P.base=s.position;P.t0=performance.now();P.playing=!s.paused;spLoaded=true;
  if(changed||jump)P.last=s.position;
  if(changed){hideNote();renderNow();applyColors(t);renderMini()}
  updatePlayIcons();setTimeout(mediaSync,500);
}
function startPlayer(){
  window.onSpotifyWebPlaybackSDKReady=()=>{
    sp=new Spotify.Player({name:'Margen',getOAuthToken:cb=>token().then(cb),volume:1});
    sp.addListener('ready',({device_id})=>{dev=device_id;sp.getVolume().then(v=>vol=v||1);api('/me/player',{method:'PUT',body:JSON.stringify({device_ids:[device_id],play:false})}).catch(()=>{});island('●','Spotify conectado',2200)});
    sp.addListener('player_state_changed',onState);
    ['authentication_error','account_error','initialization_error'].forEach(k=>sp.addListener(k,e=>island('!',k==='account_error'?'Se requiere Spotify Premium':e.message,5000)));
    sp.connect();
  };
  const s=document.createElement('script');s.src='https://sdk.scdn.co/spotify-player.js';document.head.appendChild(s);
  setInterval(async()=>{if(sp&&P.playing){const s=await sp.getCurrentState();if(s)onState(s)}mediaSync()},5000);
}
async function goLive(){
  const me=await api('/me'),lib=await fetchLibrary();
  let local=[];try{local=JSON.parse(localStorage.getItem(KEY+'.live'))||[]}catch(e){}
  uid=me.id;live=true;
  const merged=await sbPull(local).catch(()=>local);
  if(!lib.T.length){live=false;island('!','Tu biblioteca está vacía',3500);return}
  /* Intercambio síncrono: nunca queda P.tid apuntando a una canción de demostración */
  T=lib.T;PL=lib.PL;queue=T.map(t=>t.id);notes=merged;
  notes.forEach(n=>{if(!TR(n.tid)&&n.meta)T.push(mkTrack({id:n.tid,...n.meta},true))});

}
async function initSpotify(){
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  const code=new URLSearchParams(location.search).get('code');
  if(code){
    history.replaceState(null,'',REDIRECT);

    catch(e){island('!','No se pudo conectar con Spotify',4000);return}
  }
  if(!tok())return;
  try{await goLive()}catch(e){live=false;island('!','No se pudo cargar tu biblioteca',4000)}
}

/* ---------- Pantalla de bloqueo / Centro de control (Media Session) ---------- */
function mediaSync(){
  const ms=navigator.mediaSession;if(!ms||!P.tid)return;const t=cur();if(!t)return;
  try{
    const m=ms.metadata;
    if(!m||m.title!==t.title||m.artist!==t.artist)ms.metadata=new MediaMetadata({title:t.title,artist:t.artist,album:t.album,artwork:t.cover?[{src:t.cover,sizes:'640x640',type:'image/jpeg'}]:[]});
    ms.playbackState=P.playing?'playing':'paused';
    if(ms.setPositionState&&t.dur)ms.setPositionState({duration:t.dur/1000,playbackRate:1,position:Math.min(pos(),t.dur)/1000});
  }catch(e){}
}
if('mediaSession' in navigator){
  const h=(a,f)=>{try{navigator.mediaSession.setActionHandler(a,f)}catch(e){}};
  h('play',()=>setPlaying(true));h('pause',()=>setPlaying(false));
  h('previoustrack',()=>step(-1));h('nexttrack',()=>step(1));
  h('seekto',d=>{if(d.seekTime!=null)seek(d.seekTime*1000)});
  h('seekbackward',null);h('seekforward',null);
}

/* ---------- Giroscopio: la luz se desplaza bajo el cristal ---------- */
const aura=$('#aura');let gx=0,gy=0,tx=0,ty=0,gyro=false;
const setTilt=(x,y)=>{tx=Math.max(-1,Math.min(1,x));ty=Math.max(-1,Math.min(1,y))};
const onTilt=e=>{if(e.gamma==null)return;gyro=true;setTilt(e.gamma/35,(e.beta-45)/35)};
const MK='marginalia.motion',ls=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const needPerm=typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function';
let asked=false;
async function enableTilt(ask){
  if(reduce||asked)return;
  const st=ls(MK);if(needPerm&&st==='denied')return;
  try{
    if(needPerm&&(ask||st!=='granted')){asked=true;const r=await DeviceOrientationEvent.requestPermission();try{localStorage.setItem(MK,r)}catch(e){}if(r!=='granted')return}
    addEventListener('deviceorientation',onTilt);
  }catch(e){}
}
if(!needPerm||ls(MK)==='granted'){enableTilt(false);if(needPerm)setTimeout(()=>{if(!gyro)stage.addEventListener('click',()=>enableTilt(true),{once:true})},1500)}
else stage.addEventListener('click',()=>enableTilt(false),{once:true});
addEventListener('pointermove',e=>{if(gyro||reduce||e.pointerType!=='mouse')return;const b=stage.getBoundingClientRect();setTilt((e.clientX-b.left)/b.width*2-1,(e.clientY-b.top)/b.height*2-1)});
(function tilt(){
  if(Math.abs(tx-gx)>.001||Math.abs(ty-gy)>.001){gx+=(tx-gx)*.06;gy+=(ty-gy)*.06;aura.style.setProperty('--gx',gx.toFixed(3));aura.style.setProperty('--gy',gy.toFixed(3))}
  requestAnimationFrame(tilt);
})();
stage.addEventListener('pointerdown',e=>{if(e.target.closest('.press')&&navigator.vibrate)navigator.vibrate(6)});

/* ---------- Boot ---------- */
stage.style.setProperty('--H',stage.clientHeight+'px');
renderLibrary();renderSearch();renderNotes();
load('t1',0,false);
requestAnimationFrame(frame);
initSpotify();
