 return{get:k=>tx('readonly',s=>s.get(k)).catch(()=>null),set:(k,v)=>tx('readwrite',s=>s.put(v,k)).catch(()=>{})}})();

  ${top.length?`<h2>Tus artistas</h2>${top.map((x,i)=>`<div class="rk"><i>${i+1}</i><b>${esc(x[0])}</b><span>${x[1]} ${x[1]===1?'escucha':'escuchas'}</span></div>`).join('')}`:`<h2>Tus artistas</h2><p class="pb">Reproduce música y aquí aparecerán tus artistas más escuchados.</p>`}
  ${tt.length?`<h2>Tus canciones top</h2>${list(tt,'pt')}`:''}
  ${rec.length?`<h2>Escuchado recientemente</h2>${tcards(rec,'pr')}`:''}
  ${D.pl.length?`<h2>Tus listas</h2><div class="hs">${D.pl.slice(0,12).map(card).join('')}</div>`:''}
  <h2>Cuenta</h2>${row('Usuario',me.display_name||me.id)}${row('Plan',plan)}${row('País',me.country)}${row('Seguidores',fol)}<div class="pin">Datos del perfil<span>Solo en este iPhone</span></div>
  <button class="btn plo" data-logout>Cerrar sesión</button>`;
  hdr($('#t-me'),$('#t-me').scrollTop);
  if(!QME&&!again)getMe().then(()=>{syncPbtn();if(!$('#t-me').hidden)drawMe(true)}).catch(()=>{})}
function editProfile(){
  const pr=PROF();let pic=pr.pic||'',col=pr.col||0;
  const o=document.createElement('div');o.id='qm-dlg';
  o.innerHTML=`<div class="box"><h3>Editar perfil</h3><div class="pav"><button type="button" class="cvb" data-pick aria-label="Elegir foto"></button><div style="flex:1;min-width:0"><input type="text" data-n maxlength="40" placeholder="Nombre" autocomplete="off"><button type="button" data-rm style="margin-top:8px;font-size:14px;color:#6c6c70;padding:2px 0">Quitar foto</button></div></div><input type="text" data-b maxlength="80" placeholder="Descripción (opcional)" autocomplete="off"><input type="file" accept="image/*" hidden><div class="bt"><button data-x>Cancelar</button><button data-ok class="p">Guardar</button></div></div>`;
  document.body.appendChild(o);
  const ni=$('[data-n]',o),bi=$('[data-b]',o),pb=$('[data-pick]',o),fi=$('input[type=file]',o),rm=$('[data-rm]',o);
  ni.value=pr.name||(QME&&QME.display_name)||'';bi.value=pr.bio||'';
  const ps=()=>{pb.innerHTML=pic?`<img src="${esc(pic)}" alt="">`:`${ic('<rect x="3.5" y="5.5" width="17" height="13" rx="2.5"/><circle cx="12" cy="12" r="3.2"/>')}<span>Foto</span>`;rm.hidden=!pic;$$('[data-c]',o).forEach(b=>b.classList.toggle('on',+b.dataset.c===col))};ps();
  fi.onchange=async()=>{const f=fi.files&&fi.files[0];if(!f)return;try{pic=(await prepCover(f)).preview;ps()}catch(e){toast('No se pudo leer esa imagen')}};
  const save=()=>{try{localStorage.setItem('qm.prof',JSON.stringify({name:ni.value.trim(),bio:bi.value.trim(),col,pic}))}catch(e){toast('No hay espacio para guardar la foto');return}o.remove();drawMe();syncPbtn();toast('Perfil actualizado')};
  o.addEventListener('click',e=>{
    if(e.target===o||e.target.closest('[data-x]'))o.remove();
    else if(e.target.closest('[data-pick]'))fi.click();
    else if(e.target.closest('[data-rm]')){pic='';ps()}
    else if(e.target.closest('[data-c]')){col=+e.target.closest('[data-c]').dataset.c;ps()}
    else if(e.target.closest('[data-ok]'))save()});
  [ni,bi].forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter')save()}))}

/* ---------- Arranque ---------- */
function connectScreen(msg){$('#t-home').innerHTML=`<div class="empty"><h1>Q-Music</h1><p>${esc(msg||'Tu música de Spotify, con una interfaz pensada para iPhone. Requiere Spotify Premium.')}</p><button class="cn" data-connect>Conectar con Spotify</button>${/iP(hone|ad)/.test(navigator.userAgent)&&!navigator.standalone?'<p style="margin-top:18px;font-size:13px">Para verla a pantalla completa: Compartir → Agregar a inicio y deja activado «Abrir como app web».</p>':''}</div>`}

/* ---- Spotify Connect (para iPhone/WKWebView, donde el SDK web no funciona) ----
   Se maneja la app de Spotify del teléfono mediante la Web API y se imita la interfaz del SDK. */
const stFrom=j=>{if(!j||!j.item||j.currently_playing_type==='ad')return null;
  return{track_window:{current_track:j.item},position:j.progress_ms||0,duration:j.item.duration_ms||0,paused:!j.is_playing,shuffle:!!j.shuffle_state,repeat_mode:({off:0,context:1,track:2})[j.repeat_state]||0}};
const mkConn=()=>({
  activateElement(){},connect(){return Promise.resolve(true)},addListener(){},setVolume(){return Promise.resolve()},
  getCurrentState:async()=>{try{return stFrom(await api('/me/player'))}catch(e){return null}},
  togglePlay:()=>P.playing?api('/me/player/play?device_id='+dev,{method:'PUT'}).catch(()=>{}):api('/me/player/pause?device_id='+dev,{method:'PUT'}).catch(()=>{}),
  resume:()=>api('/me/player/play?device_id='+dev,{method:'PUT'}),
  pause:()=>api('/me/player/pause?device_id='+dev,{method:'PUT'}),
  seek:ms=>api('/me/player/seek?position_ms='+Math.round(ms)+'&device_id='+dev,{method:'PUT'}),
  nextTrack:()=>api('/me/player/next?device_id='+dev,{method:'POST'}).catch(()=>{}),
  previousTrack:()=>api('/me/player/previous?device_id='+dev,{method:'POST'}).catch(()=>{})});
/* Elige dónde sonará Spotify: primero el reproductor del SDK; si no existe, un dispositivo de Spotify Connect */
async function findDevice(force){
  if(PREM===false)return;
  if(spSdk&&sdkDev&&!force){sp=spSdk;dev=sdkDev;return}
  try{
    const r=await api('/me/player/devices');
    const l=(r&&r.devices||[]).filter(d=>d.id&&!d.is_restricted&&d.name!=='Q-Music');
    const d=l.find(x=>x.is_active)||l.find(x=>/smartphone/i.test(x.type))||l[0];
    if(d){spConn=spConn||mkConn();sp=spConn;dev=d.id;return}
  }catch(e){}
  if(spSdk&&sdkDev){sp=spSdk;dev=sdkDev}
}
function startPlayer(){
  window.onSpotifyWebPlaybackSDKReady=()=>{
    spSdk=new Spotify.Player({name:'Q-Music',getOAuthToken:cb=>token().then(cb),volume:1});
    sp=sp||spSdk;
    spSdk.addListener('ready',({device_id})=>{sdkDev=device_id;if(!dev){sp=spSdk;dev=device_id}api('/me/player',{method:'PUT',body:JSON.stringify({device_ids:[device_id],play:false})}).catch(()=>{})});
    spSdk.addListener('not_ready',()=>{sdkDev='';if(sp===spSdk)dev=''});
    spSdk.addListener('player_state_changed',onState);
    /* Cuenta gratuita: el SDK devuelve account_error. En iPhone el SDK no puede iniciar: se usa Spotify Connect. */
    spSdk.addListener('account_error',()=>{sdkDev='';if(sp===spSdk)dev='';ytNote()});
    spSdk.addListener('initialization_error',()=>{sdkDev='';if(sp===spSdk)dev='';findDevice(true)});
    spSdk.addListener('authentication_error',e=>{toast('Error de Spotify: '+e.message)});
    spSdk.connect();
  };
  const s=document.createElement('script');s.src='https://sdk.scdn.co/spotify-player.js';
  s.onerror=()=>findDevice(true);
  document.head.appendChild(s);
  setTimeout(()=>{if(!dev)findDevice(true)},4000);
  setInterval(async()=>{if(!sp||!dev)return;const s=await sp.getCurrentState().catch(()=>null);if(s)onState(s)},3000);
}

async function go(){const c=jl('qm.c',null);if(c){D.liked=c.l;D.total=c.n;D.pl=c.p;D.al=c.a;D.recent=c.r;[...D.liked,...D.recent].forEach(t=>R.set(t.id,t));D.liked.forEach(t=>liked.add(t.id));[...D.pl,...D.al].forEach(x=>C.set(x.kind+':'+x.id,x));$('#app').classList.remove('off');drawHome();drawLib()}
  const sg=()=>JSON.stringify([D.pl.map(x=>x.id),D.al.map(x=>x.id),D.recent.slice(0,12).map(t=>t.id),D.liked.slice(0,10).map(t=>t.id),D.total]),s0=c?sg():null;
  const [lk,pl,al,rc]=await Promise.all([api('/me/tracks?limit=50'),api('/me/playlists?limit=50'),api('/me/albums?limit=50').catch(()=>({items:[]})),api('/me/player/recently-played?limit=30').catch(()=>({items:[]}))]);
  D.liked=lk.items.map(i=>mk(i.track)).filter(Boolean);D.total=lk.total||D.liked.length;D.liked.forEach(t=>liked.add(t.id));
  D.pl=pl.items.filter(Boolean).map(p=>coll('pl',p,(p.owner&&p.owner.display_name)||'')).filter(Boolean);
  D.al=al.items.map(i=>i.album&&coll('al',i.album,(i.album.artists||[]).map(a=>a.name).join(', '))).filter(Boolean);
  const seen=new Set();D.recent=rc.items.map(i=>mk(i.track)).filter(t=>t&&!seen.has(t.id)&&seen.add(t.id));
  try{localStorage.setItem('qm.c',JSON.stringify({l:D.liked.slice(0,300),n:D.total,p:D.pl,a:D.al,r:D.recent.slice(0,12)}))}catch(e){}$('#app').classList.remove('off');if(!s0||sg()!==s0){drawHome();drawLib()}startPlayer();drawRec().catch(()=>{});setTimeout(cacheCovers,6000);getMe().then(m=>{PREM=m&&m.product?m.product==='premium':null;try{syncPbtn()}catch(e){}}).catch(()=>{});
  (async()=>{let o=50;while(D.liked.length<D.total&&o<500){const r=await api('/me/tracks?limit=50&offset='+o).catch(()=>null);if(!r||!r.items.length)break;r.items.forEach(i=>{const t=mk(i.track);if(t){D.liked.push(t);liked.add(t.id)}});o+=50}drawLib()})();
}
async function init(){
  const code=new URLSearchParams(location.search).get('code');
  if(code){history.replaceState(null,'',RED);try{saveTok(await tokReq({grant_type:'authorization_code',code,redirect_uri:RED,code_verifier:localStorage.getItem('marginalia.pkce')}))}catch(e){connectScreen('No se pudo conectar con Spotify. Inténtalo otra vez.');return}}
  if(tok()&&localStorage.getItem('margen.sc')!==SC){localStorage.removeItem(TK);connectScreen('Q-Music ahora necesita permisos nuevos (crear listas y cambiar su portada). Vuelve a conectar tu cuenta.');return}
  if(!tok()){connectScreen();return}
  try{await go()}catch(e){
    if(jl('qm.c',null)&&!(e&&(e.status===401||e.status===403))){OFFSTART=true;$('#app').classList.remove('off');netUi();toast('Sin conexión: mostrando tu biblioteca guardada');getMe().catch(()=>{})}
    else connectScreen('No se pudo cargar tu biblioteca. Vuelve a conectar.')}
}
document.addEventListener('click',async e=>{
  const t=e.target.closest&&e.target.closest('[data-pbtn],[data-pback],[data-logout],[data-pinchg],[data-pinrm]');if(!t)return;
  if(t.matches('[data-pbtn]'))tab('me');
  else if(t.matches('[data-pback]'))tab(ptab||'home');
  else if(t.matches('[data-pinchg]'))pinPicker();
  else if(t.matches('[data-pinrm]')){try{localStorage.removeItem('qm.pin')}catch(_){}drawMe(true);toast('Quitada del perfil')}
  else if(await confirmDlg('¿Cerrar sesión?','Se desconectará tu cuenta de Spotify en este dispositivo.','Cerrar sesión')){try{localStorage.removeItem(TK)}catch(_){}location.reload()}
});
$('#app').classList.add('off');init();
})();
