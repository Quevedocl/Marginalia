async function start(body,t){

    ytStop();                                   /* corta ya el reproductor secundario anterior */
    if(sp){muted=true;clearTimeout(mt);vset(0)} /* silencia la pista previa de Spotify hasta que cargue la nueva */
    pend={id:t.id,until:performance.now()+3500};
    P.t=t;P.pos=0;P.t0=performance.now();P.playing=true;paint(true);ytPlay(t);
  }
  try{
    if(sp&&dev) await api('/me/player/play?device_id='+dev,{method:'PUT',body:JSON.stringify(body)});
  }catch(e){
    if(e&&e.status===403) {

}
