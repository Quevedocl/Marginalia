 fi.onchange=async()=>{const f=fi.files&&fi.files[0];if(!f)return;try{cv=await prepCover(f);pb.innerHTML=`<img src="${cv.preview}" alt="">`}catch(e){toast('No se pudo leer esa imagen')}};
 o.addEventListener('click',e=>{if(e.target===o||e.target.closest('[data-x]'))done(null);else if(e.target.closest('[data-pick]'))fi.click();else if(e.target.closest('[data-ok]')){const n=inp.value.trim();if(n)done({name:n,cover:cv});else inp.focus()}});
 inp.addEventListener('keydown',e=>{if(e.key==='Enter'){const n=inp.value.trim();if(n)done({name:n,cover:cv})}})})}
async function newList(t){
 const r=await askList();if(!r)return null;const name=r.name,cv=r.cover;let p;
 try{p=await mkList(name)}
 catch(e){let m='';try{const j=await e.json();m=j&&j.error&&j.error.message||''}catch(_){}toast(e&&e.status===403?'Spotify rechazó crear la lista (403'+(m?': '+m:'')+')':'No se pudo crear la lista'+(e&&e.status?' ('+e.status+(m?': '+m:'')+')':''));return null}
 const c=coll('pl',p,'Tú');if(c){if(cv)c.cover=cv.thumb;D.pl.unshift(c);drawLib()}
 let msg=t?'Añadida a «'+name+'»':'Lista «'+name+'» creada';
 if(t){try{await addTo(p.id,t)}catch(e){msg='Lista creada, pero no se pudo añadir la canción'}}
 if(cv){try{await setCover(p.id,cv.b64)}catch(e){msg+=' · no se pudo subir la portada'+(e&&(e.status===401||e.status===403)?' (vuelve a conectar Spotify)':'')}}
 toast(msg);return p}
async function addPicker(t){
 const M=$('#menu'),mc=$('#mc');
 mc.innerHTML=`<div class="hd"><img src="${esc(t.sm)}" alt=""><div class="m"><b>Añadir a una lista</b><span>${esc(t.name)}</span></div></div><button class="mi" data-new>Nueva lista${NI}</button><div class="scl" id="pls"><div class="mi" style="color:var(--l2)">Cargando…</div></div>`;
 mc.onclick=async e=>{
  if(e.target.closest('[data-new]')){M.classList.remove('open');newList(t);return}
  const b=e.target.closest('[data-pl]');if(!b)return;M.classList.remove('open');
  try{await addTo(b.dataset.pl,t);toast('Añadida a «'+b.dataset.n+'»')}catch(err){toast(err&&err.status===403?'Falta un permiso: cierra la app y vuelve a conectar Spotify':'No se pudo añadir a la lista')}};
 M.classList.add('open');
 try{const [u,r]=await Promise.all([getMe(),api('/me/playlists?limit=50')]);
  const mine=(r.items||[]).filter(p=>p&&p.id&&((p.owner&&p.owner.id===u.id)||p.collaborative));
  const x=$('#pls');if(x)x.innerHTML=mine.length?mine.map(p=>`<button class="mi" data-pl="${esc(p.id)}" data-n="${esc(p.name)}"><span>${esc(p.name)}</span></button>`).join(''):'<div class="mi" style="color:var(--l2)">Aún no tienes listas propias</div>'}
 catch(e){const x=$('#pls');if(x)x.innerHTML='<div class="mi" style="color:var(--l2)">No se pudieron cargar tus listas</div>'}}
async function artistData(id,name){
 let tr=[];
 try{const r=await api('/artists/'+id+'/top-tracks?market=from_token');tr=(r.tracks||[]).map(x=>mk(x)).filter(Boolean)}catch(e){}
 if(tr.length<5){
  const q=encodeURIComponent('artist:"'+name+'"');
  const rs=await Promise.all([0,10].map(o=>api('/search?type=track&limit=10&offset='+o+'&q='+q).catch(()=>null)));
  let xs=[];rs.forEach(r=>{if(r&&r.tracks&&r.tracks.items)xs.push(...r.tracks.items)});
  xs=xs.filter(x=>x&&x.artists&&x.artists.some(a=>a.id===id));xs.sort((a,b)=>(b.popularity||0)-(a.popularity||0));
  const seen=new Set(tr.map(t=>t.id));xs.forEach(x=>{if(!seen.has(x.id)){seen.add(x.id);const t=mk(x);if(t)tr.push(t)}});tr=tr.slice(0,10)}
 const mkAl=x=>coll('al',x,(x.release_date||'').slice(0,4)+' · '+(x.album_type==='single'?'Sencillo':'Álbum'));
 let al=[];
 try{const r=await api('/artists/'+id+'/albums?include_groups=album,single&limit=20');al=(r.items||[]).map(mkAl).filter(Boolean)}catch(e){}
 if(!al.length){const r=await api('/search?type=album&limit=10&q='+encodeURIComponent('artist:"'+name+'"')).catch(()=>null);
  al=((r&&r.albums&&r.albums.items)||[]).filter(x=>x&&x.artists&&x.artists.some(a=>a.id===id)).map(mkAl).filter(Boolean)}
 return {tr,al}}
function connectScreen(msg){$('#t-home').innerHTML=`<div class="empty"><h1>Q-Music</h1><p>${esc(msg||'Tu música de Spotify, con una interfaz pensada para iPhone. Funciona con o sin Premium gracias al motor alternativo.')}</p><button class="cn" data-connect>Conectar con Spotify</button>${/iP(hone|ad)/.test(navigator.userAgent)&&!navigator.standalone?'<p style="margin-top:18px;font-size:13px">Para verla a pantalla completa: Compartir → Agregar a inicio y deja activado «Abrir como app web».</p>':''}</div>`}
function startPlayer(){
  window.onSpotifyWebPlaybackSDKReady=()=>{
    sp=new Spotify.Player({name:'Q-Music',getOAuthToken:cb=>token().then(cb),volume:1});
    sp.addListener('ready',({device_id})=>{dev=device_id;api('/me/player',{method:'PUT',body:JSON.stringify({device_ids:[device_id],play:false})}).catch(()=>{})});
    sp.addListener('player_state_changed',onState);
    ['authentication_error','account_error','initialization_error'].forEach(k=>sp.addListener(k,e=>toast(k==='account_error'?'Aviso: Cuenta Free detectada, usando motor alternativo':e.message)));
    sp.connect();
  };
  const s=document.createElement('script');s.src='https://sdk.scdn.co/spotify-player.js';document.head.appendChild(s);
  setInterval(async()=>{if(!sp)return;const s=await sp.getCurrentState().catch(()=>null);if(s)onState(s)},3000);
}
async function go(){const c=jl('qm.c',null);if(c){D.liked=c.l;D.total=c.n;D.pl=c.p;D.al=c.a;D.recent=c.r;[...D.liked,...D.recent].forEach(t=>R.set(t.id,t));D.liked.forEach(t=>liked.add(t.id));[...D.pl,...D.al].forEach(x=>C.set(x.kind+':'+x.id,x));$('#app').classList.remove('off');drawHome();drawLib()}
  const sg=()=>JSON.stringify([D.pl.map(x=>x.id),D.al.map(x=>x.id),D.recent.slice(0,12).map(t=>t.id),D.liked.slice(0,10).map(t=>t.id),D.total]),s0=c?sg():null;
  const [lk,pl,al,rc]=await Promise.all([api('/me/tracks?limit=50'),api('/me/playlists?limit=50'),api('/me/albums?limit=50').catch(()=>({items:[]})),api('/me/player/recently-played?limit=30').catch(()=>({items:[]}))]);
  D.liked=lk.items.map(i=>mk(i.track)).filter(Boolean);D.total=lk.total||D.liked.length;D.liked.forEach(t=>liked.add(t.id));
  D.pl=pl.items.filter(Boolean).map(p=>coll('pl',p,(p.owner&&p.owner.display_name)||'')).filter(Boolean);
  D.al=al.items.map(i=>i.album&&coll('al',i.album,(i.album.artists||[]).map(a=>a.name).join(', '))).filter(Boolean);
  const seen=new Set();D.recent=rc.items.map(i=>mk(i.track)).filter(t=>t&&!seen.has(t.id)&&seen.add(t.id));
  try{localStorage.setItem('qm.c',JSON.stringify({l:D.liked.slice(0,50),n:D.total,p:D.pl,a:D.al,r:D.recent.slice(0,12)}))}catch(e){}$('#app').classList.remove('off');if(!s0||sg()!==s0){drawHome();drawLib()}startPlayer();drawRec().catch(()=>{});
  (async()=>{let o=50;while(D.liked.length<D.total&&o<500){const r=await api('/me/tracks?limit=50&offset='+o).catch(()=>null);if(!r||!r.items.length)break;r.items.forEach(i=>{const t=mk(i.track);if(t){D.liked.push(t);liked.add(t.id)}});o+=50}drawLib()})();
}
async function init(){
  const code=new URLSearchParams(location.search).get('code');
  if(code){history.replaceState(null,'',RED);try{saveTok(await tokReq({grant_type:'authorization_code',code,redirect_uri:RED,code_verifier:localStorage.getItem('marginalia.pkce')}))}catch(e){connectScreen('No se pudo conectar con Spotify. Inténtalo otra vez.');return}}
  if(tok()&&localStorage.getItem('margen.sc')!==SC){localStorage.removeItem(TK);connectScreen('Q-Music ahora necesita permisos nuevos (crear listas y cambiar su portada). Vuelve a conectar tu cuenta.');return}
  if(!tok()){connectScreen();return}
  try{await go()}catch(e){connectScreen('No se pudo cargar tu biblioteca. Vuelve a conectar.')}
}
$('#app').classList.add('off');init();
})();
