/* ---------- Spotify: OAuth PKCE ---------- */

/* ---------- Datos ---------- */
const R=new Map(),L={},C=new Map(),liked=new Set(),D={liked:[],total:0,pl:[],al:[],recent:[]};

/* ---------- Estado de reproducción ---------- */
const P={t:null,pos:0,t0:0,playing:false,shuf:false,rep:0};let sp=null,dev='',vol=1,scrub=false;
const now=()=>P.t?Math.min(P.t.dur||1e9,P.pos+(P.playing?performance.now()-P.t0:0)):0;
function wav(){const n=8000,b=new Uint8Array(44+n),v=new DataView(b.buffer),w=(o,s)=>[...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));w(0,'RIFF');v.setUint32(4,36+n,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,8000,true);v.setUint32(28,8000,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,'data');v.setUint32(40,n,true);b.fill(128,44);return URL.createObjectURL(new Blob([b],{type:'audio/wav'}))}

  if(m.dataset.id!==t.id){m.dataset.id=t.id;m.innerHTML=`<img src="${esc(t.sm)}" alt=""><div class="m"><b>${esc(t.name)}</b><span>${esc(t.artist)}</span></div><button class="ic" data-pp aria-label="Reproducir o pausar"></button><button class="ic" data-nx aria-label="Siguiente">${I.next}</button>`}
  $('[data-pp]',m).innerHTML=P.playing?I.pause:I.play;
  $('#np-img').src=t.lg;$('#sheet').style.setProperty('--bg',`url("${t.lg}")`);$('#np-t').textContent=t.name;$('#np-a').textContent=t.artist+(t.album?' — '+t.album:'');
  $('#sheet').classList.toggle('pz',!P.playing);
  $('#pp').innerHTML=P.playing?I.pause:I.play;$('#prev').innerHTML=I.prev;$('#next').innerHTML=I.next;
  const lk=liked.has(t.id);$('#np-like').innerHTML=lk?I.heartF:I.heart;$('#np-like').style.color=lk?'var(--acc)':'';$('#np-more').innerHTML=I.more;
  $('#shuf').innerHTML=I.shuf;$('#shuf').classList.toggle('on',P.shuf);$('#rep').innerHTML=I.rep;$('#rep').classList.toggle('on',P.rep>0);$('#rep').classList.toggle('r1',P.rep===2);$('#qb').innerHTML=I.q;$('#qb').classList.toggle('on',$('#sheet').classList.contains('q'));
  $$('[data-id]').forEach(r=>{if(r.classList.contains('row'))r.classList.toggle('on',r.dataset.id===t.id)});
  media();tick();
}
function tick(){const t=P.t;if(!t||scrub)return;const p=now(),k=t.dur?p/t.dur*1000:0,s=$('#seek');s.value=k;s.style.setProperty('--p',k/10+'%');$('#el').textContent=fmt(p);$('#rm').textContent='-'+fmt((t.dur||0)-p)}
setInterval(()=>{if($('#sheet').classList.contains('open'))tick()},250);

function media(){const ms=navigator.mediaSession,t=P.t;if(!ms||!t)return;
 try{if(!ms.metadata||ms.metadata.title!==t.name||ms.metadata.artist!==t.artist)ms.metadata=new MediaMetadata({title:t.name,artist:t.artist,album:t.album,artwork:t.lg?[{src:t.lg,sizes:'640x640',type:'image/jpeg'}]:[]});
 ms.playbackState=P.playing?'playing':'paused';if(ms.setPositionState&&t.dur)ms.setPositionState({duration:t.dur/1000,playbackRate:1,position:now()/1000})}catch(e){}}
if(navigator.mediaSession){const h=(a,f)=>{try{navigator.mediaSession.setActionHandler(a,f)}catch(e){}};
 h('play',()=>sp&&sp.resume());h('pause',()=>sp&&sp.pause());h('previoustrack',()=>sp&&sp.previousTrack());h('nexttrack',()=>sp&&sp.nextTrack());h('seekto',d=>sp&&d.seekTime!=null&&sp.seekTo(d.seekTime*1000))}

/* ---------- Acciones ---------- */
async function start(body,t){
  if(!sp||!dev){toast('Conectando el reproductor…');return}
  sp.activateElement();wake();
  if(t){P.t=t;P.pos=0;P.t0=performance.now();P.playing=true;paint(true)}
  try{await api('/me/player/play?device_id='+dev,{method:'PUT',body:JSON.stringify(body)})}catch(e){toast(e.status===403?'Se requiere Spotify Premium':'No se pudo reproducir')}
}
const setShuf=s=>{P.shuf=s;paint();return api('/me/player/shuffle?state='+s+'&device_id='+dev,{method:'PUT'}).catch(()=>{})};
let DC=null;
async function playL(k,i,shuf){
  const l=L[k];if(!l||!l.length)return;if(shuf!=null){await setShuf(shuf);if(shuf)i=Math.floor(Math.random()*l.length)}
  const t=l[i]||l[0];
  if(k==='d'&&DC&&DC.uri)return start({context_uri:DC.uri,offset:{uri:t.uri}},t);
  const s=i>=100?i-50:0;start({uris:l.slice(s,s+100).map(x=>x.uri),offset:{position:i-s}},t);
}
async function toggleLike(t){const on=!liked.has(t.id);on?liked.add(t.id):liked.delete(t.id);paint();
 try{await lib(on?'PUT':'DELETE',[t.id]);toast(on?'Añadida a Favoritas':'Quitada de Favoritas');if(on){if(!D.liked.some(x=>x.id===t.id)){D.liked.unshift(t);D.total++}}else{D.liked=D.liked.filter(x=>x.id!==t.id);D.total--}drawLib()}
 catch(e){on?liked.delete(t.id):liked.add(t.id);paint();toast('No se pudo actualizar Favoritas')}}
async function playNext(t){try{await api('/me/player/queue?uri='+encodeURIComponent(t.uri)+'&device_id='+dev,{method:'POST'});toast('Se reproducirá a continuación')}catch(e){toast(e.status===404?'Reproduce algo primero':'No se pudo añadir a la cola')}}
function menu(id){
  const t=R.get(id);if(!t)return;const lk=liked.has(id),M=$('#menu'),mc=$('#mc');
  mc.innerHTML=`<div class="hd"><img src="${esc(t.sm)}" alt=""><div class="m"><b>${esc(t.name)}</b><span>${esc(t.artist)}</span></div></div>
  <button class="mi" data-a="next">Reproducir a continuación${I.next2}</button>
  <button class="mi" data-a="like">${lk?'Quitar de Favoritas':'Añadir a Favoritas'}${lk?I.heartF:I.heart}</button>
  <button class="mi" data-a="open">Abrir en Spotify${I.sp}</button>`;
  mc.onclick=e=>{const a=e.target.closest('[data-a]');if(!a)return;M.classList.remove('open');const k=a.dataset.a;if(k==='next')playNext(t);else if(k==='like')toggleLike(t);else window.open('https://open.spotify.com/track/'+t.id,'_blank')};
  M.classList.add('open');
}
$('#menu').addEventListener('click',e=>{if(e.target.id==='menu')e.currentTarget.classList.remove('open')});

/* ---------- Vistas ---------- */
const row=(t,k,i)=>`<div class="row${P.t&&P.t.id===t.id?' on':''}" data-id="${t.id}" data-l="${k}" data-i="${i}" role="button" tabindex="0"><img src="${esc(t.sm)}" alt="" loading="lazy"><div class="m"><b>${esc(t.name)}</b><span>${esc(t.artist)}</span></div><button class="dots" data-m="${t.id}" aria-label="Más opciones">${I.more}</button></div>`;
const list=(a,k)=>{L[k]=a;return a.map((t,i)=>row(t,k,i)).join('')};
const crow=c=>`<div class="lrow" data-open="${c.kind}:${c.id}" role="button" tabindex="0"><img src="${esc(c.cover)}" alt="" loading="lazy"><div class="m"><b>${esc(c.name)}</b><span>${esc(c.sub)}</span></div>${I.chev}</div>`;
const card=(c,i)=>`<button class="card" data-open="${c.kind}:${c.id}"><img src="${esc(c.cover)}" alt="" loading="lazy"><b>${esc(c.name)}</b><span>${esc(c.sub)}</span></button>`;
function drawHome(){
  L.rc=D.recent;
  $('#t-home').innerHTML=`<h1>Inicio</h1>`+(D.recent.length?`<h2 style="margin-top:6px">Escuchado recientemente</h2><div class="hs">${D.recent.slice(0,12).map((t,i)=>`<button class="card" data-id="${t.id}" data-l="rc" data-i="${i}"><img src="${esc(t.lg)}" alt="" loading="lazy"><b>${esc(t.name)}</b><span>${esc(t.artist)}</span></button>`).join('')}</div>`:'')
  +(D.pl.length?`<h2>Tus listas</h2><div class="hs">${D.pl.slice(0,12).map(card).join('')}</div>`:'')
  +(D.liked.length?`<h2>Favoritas recientes</h2>${list(D.liked.slice(0,10),'hl')}`:'');
}
function drawLib(){
  $('#t-lib').innerHTML=`<h1>Biblioteca</h1><div class="lrow" data-open="liked:"><div class="hrt">${I.heartF}</div><div class="m"><b>Favoritas</b><span>${D.total} canciones</span></div>${I.chev}</div>`
  +(D.pl.length?`<h2>Listas</h2>${D.pl.map(crow).join('')}`:'')+(D.al.length?`<h2>Álbumes</h2>${D.al.map(crow).join('')}`:'');
}
const items=async id=>{let r;try{r=await api('/playlists/'+id+'/items?limit=100')}catch(e){r=await api('/playlists/'+id+'/tracks?limit=100')}return r.items.map(i=>mk(i.track||i.item)).filter(Boolean)};
async function open(key){
  const [kind,id]=key.split(':'),p=$('#push');let c=C.get(key);
  if(kind==='liked')c={kind,name:'Favoritas',sub:D.total+' canciones',cover:''};
  p.innerHTML=`<div class="bar"><button class="back" data-back>${I.back}Atrás</button></div>`;p.scrollTop=0;p.classList.add('open');
  let tr=[];DC=null;
  try{
    if(kind==='liked')tr=D.liked;
    else if(kind==='pl'){tr=await items(id);DC=c}
    else{const a=await api('/albums/'+id);tr=a.tracks.items.map(x=>mk(x,a)).filter(Boolean);c=c||coll('al',a,'');DC=c}
  }catch(e){p.insertAdjacentHTML('beforeend','<div class="empty">No se pudo cargar esta lista.</div>');return}
  L.d=tr;
  p.insertAdjacentHTML('beforeend',`<div class="hero">${kind==='liked'?`<div class="hrt">${I.heartF}</div>`:`<img src="${esc(c.cover)}" alt="">`}<h2>${esc(c.name)}</h2><p>${esc(c.sub||'')}</p><div class="btns"><button class="btn p" data-pa>${I.play}Reproducir</button><button class="btn" data-sh>${I.shuf}Aleatorio</button></div></div>${list(tr,'d')}`);
}
const closePush=()=>$('#push').classList.remove('open');
let st;
async function search(q){
  const s=$('#sr');if(!q.trim()){s.innerHTML='';return}
  try{const r=await api('/search?type=track,album,playlist&limit=10&q='+encodeURIComponent(q));
   const t=(r.tracks&&r.tracks.items||[]).map(x=>mk(x)).filter(Boolean),al=(r.albums&&r.albums.items||[]).map(x=>coll('al',x,(x.artists||[]).map(a=>a.name).join(', '))).filter(Boolean),pl=(r.playlists&&r.playlists.items||[]).map(x=>x&&coll('pl',x,(x.owner&&x.owner.display_name)||'')).filter(Boolean);
   s.innerHTML=(t.length?`<h2>Canciones</h2>${list(t,'s')}`:'')+(al.length?`<h2>Álbumes</h2>${al.map(crow).join('')}`:'')+(pl.length?`<h2>Listas</h2>${pl.map(crow).join('')}`:'')||`<div class="empty">Sin resultados para “${esc(q)}”.</div>`}
  catch(e){s.innerHTML='<div class="empty">No se pudo buscar. Inténtalo de nuevo.</div>'}
}
$('#qi').addEventListener('input',e=>{clearTimeout(st);st=setTimeout(()=>search(e.target.value),350)});
function tab(n){closePush();['home','lib','search'].forEach(k=>$('#t-'+k).hidden=k!==n);$$('.tb').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===n)))}

/* Cola de reproducción */
async function queue(){
  const S=$('#sheet');S.classList.toggle('q');paint();if(!S.classList.contains('q'))return;
  const q=$('#q');q.innerHTML='<h2>A continuación</h2><div class="empty">Cargando…</div>';
  try{const r=await api('/me/player/queue'),a=(r.queue||[]).slice(0,30).map(x=>mk(x)).filter(Boolean);L.q=a;
   q.innerHTML='<h2>A continuación</h2>'+(a.length?a.map((t,i)=>`<div class="row" data-id="${t.id}"><img src="${esc(t.sm)}" alt=""><div class="m"><b>${esc(t.name)}</b><span>${esc(t.artist)}</span></div></div>`).join(''):'<div class="empty">La cola está vacía.</div>')}
  catch(e){q.innerHTML='<h2>A continuación</h2><div class="empty">No se pudo cargar la cola.</div>'}
}

/* ---------- Eventos ---------- */
const sheet=$('#sheet'),openSheet=()=>{if(P.t)sheet.classList.add('open')},closeSheet=()=>{sheet.classList.remove('open','q');paint()};
document.addEventListener('click',e=>{
  const q=s=>e.target.closest(s);let el;
  if(q('[data-pp]')){e.stopPropagation();sp&&(sp.activateElement(),sp.togglePlay());return}
  if(q('[data-nx]')){e.stopPropagation();sp&&sp.nextTrack();return}
  if(q('#mini')){openSheet();return}
  if(el=q('[data-m]')){e.stopPropagation();menu(el.dataset.m);return}
  if(el=q('[data-l]')){playL(el.dataset.l,+el.dataset.i);return}   /* tocar una canción: suena y solo aparece el mini-reproductor */
  if(el=q('[data-open]')){open(el.dataset.open);return}
  if(q('[data-back]')){closePush();return}
  if(q('[data-pa]')){playL('d',0,false);return}
  if(q('[data-sh]')){playL('d',0,true);return}
  if(el=q('.tb')){tab(el.dataset.tab);return}
  if(q('[data-connect]'))login();
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button]')){e.preventDefault();e.target.click()}if(e.key==='Escape'){closeSheet();closePush()}});
$('#pp').onclick=()=>{if(!sp)return;sp.activateElement();wake();sp.togglePlay()};
$('#prev').onclick=()=>sp&&sp.previousTrack();$('#next').onclick=()=>sp&&sp.nextTrack();
$('#np-like').onclick=()=>P.t&&toggleLike(P.t);$('#np-more').onclick=()=>P.t&&menu(P.t.id);
$('#shuf').onclick=()=>setShuf(!P.shuf);
$('#rep').onclick=()=>{P.rep=(P.rep+1)%3;paint();api('/me/player/repeat?state='+['off','context','track'][P.rep]+'&device_id='+dev,{method:'PUT'}).catch(()=>{})};
$('#qb').onclick=queue;
const seek=$('#seek');
seek.oninput=()=>{scrub=true;const p=seek.value/1000*P.t.dur;seek.style.setProperty('--p',seek.value/10+'%');$('#el').textContent=fmt(p);$('#rm').textContent='-'+fmt(P.t.dur-p)};
seek.onchange=()=>{const p=seek.value/1000*P.t.dur;P.pos=p;P.t0=performance.now();scrub=false;sp&&sp.seekTo(p)};
const vl=$('#vol');vl.oninput=()=>{vl.style.setProperty('--p',vl.value+'%');vol=vl.value/100;sp&&sp.setVolume(vol)};vl.style.setProperty('--p','100%');
/* Arrastrar hacia abajo para cerrar */
(()=>{let y0=null;const tp=$('#top');
 tp.addEventListener('pointerdown',e=>{y0=e.clientY;tp.setPointerCapture(e.pointerId);sheet.style.transition='none'});
 tp.addEventListener('pointermove',e=>{if(y0!=null)sheet.style.transform=`translateY(${Math.max(0,e.clientY-y0)}px)`});
 const end=e=>{if(y0==null)return;const d=e.clientY-y0;y0=null;sheet.style.transition='';sheet.style.transform='';if(d>110)closeSheet()};
 tp.addEventListener('pointerup',end);tp.addEventListener('pointercancel',end);tp.addEventListener('click',closeSheet)})();

/* ---------- Arranque ---------- */
function connectScreen(msg){$('#t-home').innerHTML=`<div class="empty"><h1>Margen</h1><p>${esc(msg||'Tu música de Spotify, con una interfaz pensada para iPhone. Requiere Spotify Premium.')}</p><button class="cn" data-connect>Conectar con Spotify</button></div>`}
function startPlayer(){
  window.onSpotifyWebPlaybackSDKReady=()=>{
    sp=new Spotify.Player({name:'Margen',getOAuthToken:cb=>token().then(cb),volume:1});
    sp.addListener('ready',({device_id})=>{dev=device_id;api('/me/player',{method:'PUT',body:JSON.stringify({device_ids:[device_id],play:false})}).catch(()=>{})});
    sp.addListener('player_state_changed',onState);
    ['authentication_error','account_error','initialization_error'].forEach(k=>sp.addListener(k,e=>toast(k==='account_error'?'Se requiere Spotify Premium':e.message)));
    sp.connect();
  };
  const s=document.createElement('script');s.src='https://sdk.scdn.co/spotify-player.js';document.head.appendChild(s);
  /* Sincroniza nombre y carátula aunque no se toque nada (inicio, biblioteca, pantalla de bloqueo) */
  setInterval(async()=>{if(!sp)return;const s=await sp.getCurrentState().catch(()=>null);if(s)onState(s)},3000);
}
async function go(){
  const [lk,pl,al,rc]=await Promise.all([api('/me/tracks?limit=50'),api('/me/playlists?limit=50'),api('/me/albums?limit=50').catch(()=>({items:[]})),api('/me/player/recently-played?limit=30').catch(()=>({items:[]}))]);
  D.liked=lk.items.map(i=>mk(i.track)).filter(Boolean);D.total=lk.total||D.liked.length;D.liked.forEach(t=>liked.add(t.id));
  D.pl=pl.items.filter(Boolean).map(p=>coll('pl',p,(p.owner&&p.owner.display_name)||'')).filter(Boolean);
  D.al=al.items.map(i=>i.album&&coll('al',i.album,(i.album.artists||[]).map(a=>a.name).join(', '))).filter(Boolean);
  const seen=new Set();D.recent=rc.items.map(i=>mk(i.track)).filter(t=>t&&!seen.has(t.id)&&seen.add(t.id));
  $('#app').classList.remove('off');drawHome();drawLib();startPlayer();
  (async()=>{let o=50;while(D.liked.length<D.total&&o<500){const r=await api('/me/tracks?limit=50&offset='+o).catch(()=>null);if(!r||!r.items.length)break;r.items.forEach(i=>{const t=mk(i.track);if(t){D.liked.push(t);liked.add(t.id)}});o+=50}drawLib()})();
}
async function init(){
  const code=new URLSearchParams(location.search).get('code');
  if(code){history.replaceState(null,'',RED);try{saveTok(await tokReq({grant_type:'authorization_code',code,redirect_uri:RED,code_verifier:localStorage.getItem('marginalia.pkce')}))}catch(e){connectScreen('No se pudo conectar con Spotify. Inténtalo otra vez.');return}}
  if(tok()&&localStorage.getItem('margen.sc')!==SC){localStorage.removeItem(TK);connectScreen('Margen ahora necesita permisos nuevos (favoritos y cola). Vuelve a conectar tu cuenta.');return}
  if(!tok()){connectScreen();return}
  try{await go()}catch(e){connectScreen('No se pudo cargar tu biblioteca. Vuelve a conectar.')}
}
$('#app').classList.add('off');init();
})();
</script>
</body></html>
