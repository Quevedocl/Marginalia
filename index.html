<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Reproductor Web</title>
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            /* Soporte para el notch y áreas seguras del iPhone */
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
            background-image: radial-gradient(circle at 50% 0%, #1b4332 0%, #000 60%);
            background-attachment: fixed;
        }
        .liquid-glass {
            background: rgba(20, 20, 20, 0.4);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        input:focus {
            outline: none;
            border-color: #1b4332;
            box-shadow: 0 0 0 2px rgba(27, 67, 50, 0.5);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6">

    <div class="liquid-glass w-full max-w-sm rounded-[2rem] p-8 flex flex-col gap-8">
        
        <!-- Cabecera -->
        <div class="text-center">
            <h1 class="text-2xl font-medium tracking-tight text-white/90">Música</h1>
            <p class="text-xs text-white/40 mt-1 uppercase tracking-widest">Motor Libre</p>
        </div>

        <!-- Reproductor Embebido (Motor Gratuito) -->
        <div class="relative w-full aspect-square rounded-2xl overflow-hidden border border-white/5 bg-black/60 shadow-inner">
            <iframe 
                id="stream-engine" 
                class="w-full h-full absolute inset-0"
                src="https://www.youtube.com/embed?listType=search&list=lofi+hip+hop+radio+chill"
                frameborder="0" 
                allow="autoplay; encrypted-media" 
                allowfullscreen>
            </iframe>
        </div>

        <!-- Controles de Búsqueda -->
        <div class="flex flex-col gap-4">
            <div class="relative">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Buscar artista o canción..."
                    class="w-full bg-black/30 border border-white/10 rounded-xl px-4 py-3.5 text-sm text-white placeholder-white/30 transition-all"
                    onkeypress="if(event.key === 'Enter') loadStream()"
                >
            </div>
            
            <button 
                onclick="loadStream()"
                class="w-full bg-[#1b4332] hover:bg-[#2d6a4f] active:scale-[0.98] text-white/90 font-medium py-3.5 rounded-xl transition-all duration-200">
                Reproducir
            </button>
        </div>
    </div>

    <script>
        function loadStream() {
            const query = document.getElementById('searchInput').value;
            if (!query) return;
            
            const iframe = document.getElementById('stream-engine');
            // Carga el primer resultado de búsqueda automáticamente y se prepara para reproducir
            iframe.src = `https://www.youtube.com/embed?listType=search&list=${encodeURIComponent(query)}&autoplay=1`;
        }
    </script>
</body>
</html>
